name: Bug Report
description: Create a report to help us fix emulator bugs or instruction decoding issues.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or code snippet to reproduce the issue.
      placeholder: |
        1. Run `go run ./cmd/ps1emu --bios SCPH1001.BIN`
        2. Step 100 cycles
        3. See unexpected exception...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen according to PS1 hardware specs.
  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS version, Go version (`go version`).
